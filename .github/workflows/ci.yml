name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── ① 构建 + vet + 进程内单测(-race);并产出 linux 二进制供互通 job 复用(只编一次)。 ──
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build ./...
      - run: go vet ./... || true
      - run: go test -race -count=1 ./...
      - name: build linux binary (+http2legacy)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags "http2legacy with_tun" -o ntr-linux ./cmd/ntr
      - uses: actions/upload-artifact@v4
        with: { name: ntr-linux, path: ntr-linux, retention-days: 1 }

  # ── ② 动态发现所有 ix-*.sh → 输出 matrix 列表(加新协议加个脚本即自动多一个 job)。 ──
  discover:
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.list.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          s=$(ls test/interop/ix-*.sh | xargs -n1 basename | sed 's/\.sh$//' | jq -R . | jq -sc .)
          echo "scripts=$s" >> "$GITHUB_OUTPUT"
          echo "发现互通脚本:$s"

  # ── ③ 每个 ix-*.sh 一个独立并行 job(fail-fast:false → 互不牵连;UI 里逐协议绿/红)。 ──
  interop:
    needs: [build, discover]
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        script: ${{ fromJson(needs.discover.outputs.scripts) }}
    runs-on: ubuntu-latest
    name: interop (${{ matrix.script }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ntr-linux, path: /tmp/ntr-interop }
      - name: run ${{ matrix.script }}
        run: |
          chmod +x /tmp/ntr-interop/ntr-linux
          mkdir -p /tmp/ntr-interop
          cp /tmp/ntr-interop/ntr-linux /tmp/ntr-interop/ntr
          log=/tmp/ntr-interop/${{ matrix.script }}.log
          NTR_BIN=/tmp/ntr-interop/ntr timeout 1200 bash "test/interop/${{ matrix.script }}.sh" 2>&1 | tee "$log" || true
          p=$(grep -icE '\bPASS\b|✅|\[OK\]|通\]|通 ' "$log" || true)
          f=$(grep -icE '\bFAIL\b|❌|✗ ' "$log" || true)
          if [ "$f" -gt 0 ]; then st=FAIL; elif [ "$p" -gt 0 ]; then st=PASS; else st=UNKNOWN; fi
          mkdir -p out
          printf '%s\t%s\t%s\t%s\n' "${{ matrix.script }}" "$st" "$p" "$f" > "out/${{ matrix.script }}.tsv"
          echo "== ${{ matrix.script }}: $st (PASS=$p FAIL=$f) =="
          [ "$st" = FAIL ] && exit 1 || exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.script }}
          path: out/${{ matrix.script }}.tsv
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.script }}
          path: /tmp/ntr-interop/${{ matrix.script }}.log
          retention-days: 3

  # ── ④ 汇总所有 job 结果 → ntr report 生成 HTML → 发布 GitHub Pages(报告由 GitHub 生成托管)。 ──
  report:
    needs: interop
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/download-artifact@v4
        with: { pattern: result-*, path: results, merge-multiple: true }
      - name: aggregate + generate report
        run: |
          mkdir -p /tmp/ntr-interop site
          cat results/*.tsv > /tmp/ntr-interop/results.tsv 2>/dev/null || : > /tmp/ntr-interop/results.tsv
          sort -o /tmp/ntr-interop/results.tsv /tmp/ntr-interop/results.tsv
          go run ./cmd/ntr report --interop /tmp/ntr-interop/results.tsv --out site/index.html
          echo "### 互通汇总" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /tmp/ntr-interop/results.tsv >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
