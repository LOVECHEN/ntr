# ntr 示例配置(声明式)。层的 type = 注册表插件名;层内键原样交插件自解析。
# 通用约定:任何 `xxx-file` 键会读文件、以 `xxx` 键注入内容(如 cert-file → cert)。

inbounds:
  # VLESS over TLS 服务端入站
  - listen: 127.0.0.1:8443
    layers:
      - type: tls           # 留空证书 = 自签临时证书(仅测试);生产配 cert-file/key-file
        # cert-file: /etc/ntr/server.crt
        # key-file: /etc/ntr/server.key
      - type: vless
    users:
      - uuid: "00112233-4455-6677-8899-aabbccddeeff"
    outbound: direct

  # VLESS over REALITY 服务端入站(借真站证书、抗主动探测)
  # - listen: 0.0.0.0:443
  #   layers:
  #     - type: reality
  #       private-key: "<base64 x25519 私钥>"
  #       dest: "www.apple.com:443"
  #       server-name: "www.apple.com"
  #       short-id: "0123456789abcdef"
  #     - type: vless
  #   users:
  #     - uuid: "..."
  #   outbound: direct

outbounds:
  - name: direct
    type: direct

  # 转发到上游代理(链式部署 / 客户端出站)
  # - name: upstream
  #   type: proxy
  #   server: "1.2.3.4:8443"
  #   secret: "00112233-4455-6677-8899-aabbccddeeff"
  #   layers:
  #     - type: tls
  #       sni: "example.com"
  #       insecure: true
  #     - type: vless
